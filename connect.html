<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect — LinkedIn Cloud Engine</title>
  <link rel="icon" href="https://notion-emojis.s3-us-west-2.amazonaws.com/prod/svg-twitter/26a1.svg">
  <style>
    :root {
      --bg: #060b13;
      --card-bg: #0f172a;
      --border: #1e293b;
      --accent: #38bdf8;
      --green: #25d366;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .badge {
      display: inline-block;
      background: rgba(37, 211, 102, 0.15);
      border: 1px solid rgba(37, 211, 102, 0.3);
      color: var(--green);
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    p {
      font-size: 14.5px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.45;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    input[type="email"] {
      width: 100%;
      background: #090e17;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 15px 18px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      background: #25d366;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35);
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .footer-note {
      margin-top: 20px;
      font-size: 12.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚡ 7-Day Free Pilot</div>
    <h1>Claim Priority Setup</h1>
    <p>Enter your email to receive the setup blueprint and connect instantly with Aamir Zameer on WhatsApp.</p>

    <form id="simpleForm" action="https://formsubmit.co/azengineeringapp@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="⚡ New LinkedIn Cloud Engine Lead">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" id="nextUrl" value="https://wa.me/966582104381?text=Hi%20Aamir%21%20I%20just%20submitted%20my%20email%20for%20the%20LinkedIn%20Cloud%20Engine%207-Day%20Pilot.">

      <input type="email" name="email" id="emailBox" placeholder="Enter your work email" required autofocus>
      <button type="submit" class="btn">
        <span>Continue to WhatsApp</span> 💬
      </button>
    </form>

    <div class="footer-note">
      🔒 Zero spam • One-tap direct WhatsApp handoff
    </div>
  </div>

  <script>
    const form = document.getElementById('simpleForm');
    const emailBox = document.getElementById('emailBox');
    const nextUrl = document.getElementById('nextUrl');

    form.addEventListener('submit', function() {
      const email = emailBox.value.trim();
      const waMsg = `Hi Aamir! I just submitted my email (${email}) for the LinkedIn Cloud Engine 7-Day Free Pilot. Let's get started!`;
      nextUrl.value = `https://wa.me/966582104381?text=${encodeURIComponent(waMsg)}`;
    });
  </script>
</body>
</html>
